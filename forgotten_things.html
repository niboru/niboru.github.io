<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KnowledgeCore // Tactical Notes & Field Manual</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              850: '#151f32',
              900: '#0f172a',
              950: '#090d16',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .card-glow:hover {
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.08), 0 8px 10px -6px rgba(56, 189, 248, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500/30 selection:text-sky-200">

  <!-- Top Sticky Navigation Bar -->
  <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        
        <!-- Logo & Title -->
        <div class="flex items-center gap-3 shrink-0">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-md shadow-sky-500/20">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-bold text-base tracking-tight text-white">Knowledge<span class="text-sky-400">Core</span></h1>
              <span class="text-[10px] font-mono uppercase tracking-wider px-1.5 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800/60 font-semibold">Field Manual</span>
            </div>
            <p class="text-xs text-slate-400 hidden sm:block">Tactical reminders, physical somatic rules & fast recall</p>
          </div>
        </div>

        <!-- Real-Time Search Bar -->
        <div class="relative flex-1 max-w-md hidden md:block">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search entries, keywords, tags... (Press '/' to focus)" 
            class="w-full pl-9 pr-16 py-1.5 bg-slate-800/80 hover:bg-slate-800 focus:bg-slate-900 border border-slate-700/80 focus:border-sky-500 rounded-lg text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-sky-500 transition-all"
          />
          <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center gap-1">
            <button id="clearSearchBtn" class="hidden text-slate-400 hover:text-slate-200 p-0.5 rounded">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
            <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono text-slate-400 bg-slate-700/60 rounded border border-slate-600/60">/</kbd>
          </div>
        </div>

        <!-- Quick Action Buttons -->
        <div class="flex items-center gap-2">
          <button 
            id="openAddModalBtn" 
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-950 font-semibold text-xs transition shadow-sm shadow-sky-500/20"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
            </svg>
            <span>Add Entry</span>
          </button>

          <button 
            id="exportDataBtn" 
            title="Export knowledge base to JSON"
            class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-850 text-slate-300 hover:text-white border border-slate-700/70 text-xs font-medium transition"
          >
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <span class="hidden sm:inline">Export</span>
          </button>
        </div>

      </div>

      <!-- Mobile Search Bar (< md screens) -->
      <div class="pb-3 md:hidden">
        <div class="relative w-full">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input 
            type="text" 
            id="mobileSearchInput" 
            placeholder="Search entries or tags..." 
            class="w-full pl-9 pr-8 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-sky-500"
          />
        </div>
      </div>
    </div>
  </header>

  <!-- Sub-Header: Category Pills & Stats Bar -->
  <section class="border-b border-slate-800/80 bg-slate-900/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        
        <!-- Category Filter Pills (Scrollable on small mobile) -->
        <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pb-1 sm:pb-0" id="categoryContainer">
          <!-- Dynamic Category buttons populated by JS -->
        </div>

        <!-- Active Counter Badge -->
        <div class="flex items-center gap-2 shrink-0 self-end sm:self-auto text-xs text-slate-400 font-mono">
          <span id="counterBadge" class="px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700/80 text-slate-300 font-medium">Loading...</span>
          <button id="resetDefaultsBtn" class="text-slate-500 hover:text-slate-300 underline text-[11px] transition">Reset Defaults</button>
        </div>

      </div>
    </div>
  </section>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Active Tag Banner (shown when filtering by tag) -->
    <div id="activeTagBanner" class="hidden mb-6 p-2.5 rounded-lg bg-sky-950/60 border border-sky-800/60 flex items-center justify-between">
      <div class="flex items-center gap-2 text-xs text-sky-300">
        <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5a1.99 1.99 0 011.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
        </svg>
        <span>Filtered by tag: <strong id="activeTagName" class="text-white"></strong></span>
      </div>
      <button id="clearTagBtn" class="text-xs text-sky-400 hover:text-sky-200 underline font-medium">Clear tag filter</button>
    </div>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Cards dynamically rendered here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20">
      <div class="w-14 h-14 rounded-2xl bg-slate-800/80 border border-slate-700/80 flex items-center justify-center mx-auto mb-4 text-slate-400">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h3 class="text-base font-semibold text-slate-200">No matching entries found</h3>
      <p class="text-sm text-slate-400 mt-1 max-w-sm mx-auto">Try refining your keyword query or switch to another category filter.</p>
      <button id="clearFiltersBtn" class="mt-4 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-sky-400 transition font-medium">Clear all filters</button>
    </div>
  </main>

  <!-- Add New Entry Modal -->
  <div id="addModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700/90 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden transform transition-all">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-sky-400"></div>
          <h3 class="text-base font-semibold text-white">Add Knowledge Entry</h3>
        </div>
        <button id="closeAddModalBtn" class="text-slate-400 hover:text-slate-200 p-1 rounded-md transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="addEntryForm" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Category <span class="text-rose-400">*</span></label>
          <select id="entryCategory" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
            <option value="Health & Somatics">Health & Somatics</option>
            <option value="Mindset & Principles">Mindset & Principles</option>
            <option value="Living & Maintenance">Living & Maintenance</option>
            <option value="Hardware & Tech">Hardware & Tech</option>
            <option value="Vocabulary & Glossary">Vocabulary & Glossary</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Title / Subject <span class="text-rose-400">*</span></label>
          <input 
            type="text" 
            id="entryTitle" 
            placeholder="e.g. Toothpaste cleaning limits or Fasting rule" 
            required
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Key Takeaway / Core Principle</label>
          <input 
            type="text" 
            id="entryTakeaway" 
            placeholder="Quick 1-line rule or summary" 
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Full Details / Execution Steps <span class="text-rose-400">*</span></label>
          <textarea 
            id="entryDetails" 
            rows="4" 
            required
            placeholder="Detailed notes, steps, ratios, or mechanical rationale..." 
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 font-mono text-xs"
          ></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Tags (comma-separated)</label>
          <input 
            type="text" 
            id="entryTags" 
            placeholder="health, quick-fix, formula" 
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 text-xs font-mono"
          />
        </div>

        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800">
          <button 
            type="button" 
            id="cancelAddModalBtn" 
            class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition"
          >
            Cancel
          </button>
          <button 
            type="submit" 
            class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-xs transition shadow-sm"
          >
            Save Entry
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Box -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2.5 px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-100 shadow-xl text-sm">
    <div id="toastIcon" class="text-emerald-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <span id="toastMessage" class="font-medium text-xs">Action completed</span>
  </div>

  <!-- Application Logic -->
  <script>

    const INITIAL_KNOWLEDGE_BASE = [

    // UI Toast System

      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMessage");
      const toastIcon = document.getElementById("toastIcon");

      toastMsg.textContent = message;
      if (isError) {
        toastIcon.innerHTML = `<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;

      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 2500);
    }

    // Clipboard Copy Helper (Handles iframe constraints safely)
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast("Copied to clipboard!");
        }).catch(() => {
          fallbackCopyText(text);
        });
      } else {
        fallbackCopyText(text);
      }
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showToast("Copied to clipboard!");
      } catch (err) {
        showToast("Failed to copy text", true);
      }
      document.body.removeChild(textArea);
    }

                  class="delete-btn p-1.5 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-950/30 transition"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Card Title -->
            <h3 class="text-base font-semibold text-slate-100 group-hover:text-sky-300 transition-colors leading-snug">
              ${item.title}
            </h3>

            <!-- Key Takeaway Callout -->
            ${item.takeaway ? `
              <div class="mt-2.5 p-2 rounded-lg bg-slate-800/60 border-l-2 border-sky-400 text-xs text-sky-200/90 font-medium">
                ${item.takeaway}
              </div>
            ` : ''}

            <!-- Card Body / Instructions -->
            <div class="mt-3 text-xs text-slate-300 leading-relaxed font-normal bg-slate-950/40 p-3 rounded-lg border border-slate-800/80 overflow-x-auto font-sans">
              ${formattedDetails}
            </div>
          </div>

          <!-- Card Footer: Tags -->
          <div class="mt-4 pt-3 border-t border-slate-800/60 flex flex-wrap items-center gap-1.5">
            ${tagsHtml}
          </div>
        `;

        // Copy button event
        card.querySelector(".copy-btn").addEventListener("click", () => {
          const exportText = `${item.title.toUpperCase()}\n${item.takeaway ? `Rule: ${item.takeaway}\n` : ''}\n${item.details}`;
          copyToClipboard(exportText);
        });

        // Delete button event
        card.querySelector(".delete-btn").addEventListener("click", () => {
          deleteEntry(item.id);
        });

        // Tag pill click event to trigger tag filter
        card.querySelectorAll(".tag-pill").forEach(tagBtn => {
          tagBtn.addEventListener("click", (e) => {
            const selectedTag = e.currentTarget.getAttribute("data-tag");
            activeTag = selectedTag;
            renderCards();
          });
        });

        grid.appendChild(card);
      });
    }

    // Delete an entry
    function deleteEntry(id) {
      knowledgeBase = knowledgeBase.filter(i => i.id !== id);
      saveKnowledgeBase();
      renderCards();
      showToast("Entry removed");
    }

    // Reset default dataset
    function resetToDefaults() {
      knowledgeBase = [...INITIAL_KNOWLEDGE_BASE];
      saveKnowledgeBase();
      currentCategory = "All";
      searchQuery = "";
      activeTag = null;
      document.getElementById("searchInput").value = "";
      document.getElementById("mobileSearchInput").value = "";
      renderCategoryPills();
      renderCards();
      showToast("Reset to curated defaults");
    }

    // Export knowledge base as JSON file
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(knowledgeBase, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `knowledge_core_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("Exported JSON file");
    }

    // Modal Control
    const addModal = document.getElementById("addModal");
    const openAddModalBtn = document.getElementById("openAddModalBtn");
    const closeAddModalBtn = document.getElementById("closeAddModalBtn");
    const cancelAddModalBtn = document.getElementById("cancelAddModalBtn");
    const addEntryForm = document.getElementById("addEntryForm");

    function openModal() {
      addModal.classList.remove("hidden");
      document.getElementById("entryTitle").focus();
    }

    function closeModal() {
      addModal.classList.add("hidden");
      addEntryForm.reset();
    }

    // Event Listeners
    window.addEventListener("DOMContentLoaded", () => {
      loadKnowledgeBase();
      renderCategoryPills();
      renderCards();

      // Search Inputs
      const searchInput = document.getElementById("searchInput");
      const mobileSearchInput = document.getElementById("mobileSearchInput");
      const clearSearchBtn = document.getElementById("clearSearchBtn");

      function handleSearch(val) {
        searchQuery = val;
        if (searchQuery.trim().length > 0) {
          clearSearchBtn.classList.remove("hidden");
        } else {
          clearSearchBtn.classList.add("hidden");
        }
        renderCards();
      }

      searchInput.addEventListener("input", (e) => handleSearch(e.target.value));
      mobileSearchInput.addEventListener("input", (e) => handleSearch(e.target.value));

      clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        mobileSearchInput.value = "";
        handleSearch("");
        searchInput.focus();
      });

      // '/' Hotkey for Search
      window.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchInput && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === "Escape") {
          if (!addModal.classList.contains("hidden")) {
            closeModal();
          } else {
            searchInput.value = "";
            mobileSearchInput.value = "";
            handleSearch("");
            activeTag = null;
            renderCards();
          }
        }
      });

      // Clear Active Tag Filter
      document.getElementById("clearTagBtn").addEventListener("click", () => {
        activeTag = null;
        renderCards();
      });

      document.getElementById("clearFiltersBtn").addEventListener("click", () => {
        currentCategory = "All";
        searchQuery = "";
        activeTag = null;
        searchInput.value = "";
        mobileSearchInput.value = "";
        renderCategoryPills();
        renderCards();
      });

      // Reset Defaults
      document.getElementById("resetDefaultsBtn").addEventListener("click", () => {
        resetToDefaults();
      });

      // Export
      document.getElementById("exportDataBtn").addEventListener("click", exportJSON);

      // Modal Triggers
      openAddModalBtn.addEventListener("click", openModal);
      closeAddModalBtn.addEventListener("click", closeModal);
      cancelAddModalBtn.addEventListener("click", closeModal);

      // Handle Add Entry Form Submit
      addEntryForm.addEventListener("submit", (e) => {
        e.preventDefault();
        
        const category = document.getElementById("entryCategory").value;
        const title = document.getElementById("entryTitle").value.trim();
        const takeaway = document.getElementById("entryTakeaway").value.trim();
        const details = document.getElementById("entryDetails").value.trim();
        const rawTags = document.getElementById("entryTags").value.trim();

        if (!title || !details) return;

        const tags = rawTags 
          ? rawTags.split(",").map(t => t.trim().toLowerCase()).filter(t => t.length > 0)
          : [];

        const newEntry = {
          id: "custom-" + Date.now(),
          category,
          title,
          takeaway,
          details,
          tags
        };

        knowledgeBase.unshift(newEntry);
        saveKnowledgeBase();
        
        // Match category view so user sees new card immediately
        currentCategory = category;
        renderCategoryPills();
        renderCards();
        
        closeModal();
        showToast("New entry saved!");
      });
    });
  </script>
</body>
</html>
