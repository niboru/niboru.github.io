                m: `<div class="iframe-container"><iframe src="https://docs.google.com/document/d/e/2PACX-1vSGRVrCZUd-ro2umrHoggcMT463VgvptB75s_FgHAHy-B48fe2Mzld4XC3A_NBcBQ/pub?embedded=true" loading="lazy"></iframe></div>`
            },
            {
                t: `Pressure in Stomach <a href="https://www.youtube.com/watch?v=_V9utjNWrUs" target="_blank">&sup1;</a>`,
                t_id: `Tekanan pada Lambung <a href="https://www.youtube.com/watch?v=_V9utjNWrUs" target="_blank">&sup1;</a>`,
                c: `<p>Video demonstration for relieving epigastric pressure, fullness, and tension in the stomach region.</p>`,
                c_id: `<p>Demonstrasi video untuk meredakan tekanan epigastrik, rasa penuh, dan ketegangan di area lambung.</p>`,
                v: `vid-1`
            }
        ];

        // ==========================================
        // RENDER & LOGIC
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            const appWrapper = document.getElementById("appWrapper");
            const container = document.getElementById("contentContainer");
            const quickIndexContainer = document.getElementById("quickIndexContainer");
            const quickIndexList = document.getElementById("quickIndexList");
            const toggleQuickIndex = document.getElementById("toggleQuickIndex");
            const quickIndexArrow = document.getElementById("quickIndexArrow");
            const quickIndexLabel = document.getElementById("quickIndexLabel");
            const searchInput = document.getElementById("searchBox");
            const expandAllBtn = document.getElementById("expandAll");
            const collapseAllBtn = document.getElementById("collapseAll");
            const pinToggleBtn = document.getElementById("pinToggle");
            const langToggleBtn = document.getElementById("langToggle");
            const themeToggleBtn = document.getElementById("themeToggle");
            const fontDecBtn = document.getElementById("fontDec");
            const fontResetBtn = document.getElementById("fontReset");
            const fontIncBtn = document.getElementById("fontInc");
            const stickyControls = document.getElementById("stickyControls");

            let currentLang = "en";
            let currentTheme = "light";
            let fontScale = 100;
            let isPinned = true;

            function stripHtml(html) {
                const tmp = document.createElement("div");
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || "";
            }

            // 1. Automatically Build Cards AND Quick Jump Index from db array
            let htmlOutput = "";
            let quickLinksOutput = "";

            db.forEach((item, index) => {
                const tipHtml = item.p ? `<div class="tip-box"><strong>${uiStrings.en.proTip}</strong> ${item.p}</div>` : "";
                const mediaHtml = item.m ? item.m : "";
                const contentHtml = item.c ? item.c : "";
                
                htmlOutput += `
                <details class="data-island" id="island-${index}">
                    <summary><span class="island-title">${item.t}</span></summary>
                    <div class="island-content">
                        <div class="island-text">
                            ${tipHtml}
                            ${contentHtml}
                        </div>
                        <div class="island-media" id="media-${index}">${mediaHtml}</div>
                    </div>
                </details>`;

                quickLinksOutput += `<button type="button" class="quick-chip" data-index="${index}">${index + 1}. ${stripHtml(item.t)}</button>`;
            });

            container.innerHTML = htmlOutput;
          
          	container.querySelectorAll("iframe").forEach(iframe => {
    			iframe.setAttribute("sandbox", "allow-same-origin allow-scripts");
			});
            quickIndexList.innerHTML = quickLinksOutput;

            // 2. Move Blogger's pre-rendered video elements from the vault into their cards
            db.forEach((item, index) => {
                if (item.v) {
                    const videoElement = document.getElementById(item.v);
                    const targetMediaContainer = document.getElementById(`media-${index}`);
                    if (videoElement && targetMediaContainer) {
                        targetMediaContainer.appendChild(videoElement);
                    }
                }
            });

            const islands = document.querySelectorAll(".data-island");
            const quickChips = document.querySelectorAll(".quick-chip");

            // Force inline styles onto a single card's title & data (defeats Blogger dark CSS)
            function styleCardElements(island) {
                const isDark = currentTheme === "dark";
                const cardBg = isDark ? "#1b222d" : "#b0cce4";
                const summaryClosedBg = isDark ? "#1b222d" : "#9fc0db";
                const summaryOpenBg = isDark ? "#222b38" : "#8ab0d0";
                const borderHex = isDark ? "#2d3748" : "#6b92b5";
                const textHex = isDark ? "#e2e8f0" : "#0b1d30";
                const bodyTextHex = isDark ? "#cbd5e0" : "#0b1d30";
                const linkHex = isDark ? "#63b3ed" : "#0a3d62";
                const tipBg = isDark ? "#1a365d" : "#97bad8";
                const tipBorder = isDark ? "#63b3ed" : "#133b5c";
                const tipText = isDark ? "#bee3f8" : "#071524";

                island.style.setProperty("background-color", cardBg, "important");
                island.style.setProperty("border-color", borderHex, "important");
                island.style.setProperty("color", textHex, "important");

                const summary = island.querySelector("summary");
                if (summary) {
                    summary.style.setProperty("background-color", island.open ? summaryOpenBg : summaryClosedBg, "important");
                    summary.style.setProperty("color", textHex, "important");
                    summary.style.setProperty("border-bottom-color", borderHex, "important");
                }

                const titleSpan = island.querySelector(".island-title");
                if (titleSpan) {
                    titleSpan.style.setProperty("background-color", "transparent", "important");
                    titleSpan.style.setProperty("color", textHex, "important");
                }

                const contentBox = island.querySelector(".island-content");
                if (contentBox) {
                    contentBox.style.setProperty("background-color", cardBg, "important");
                    contentBox.style.setProperty("color", bodyTextHex, "important");
                }

                const textBox = island.querySelector(".island-text");
                if (textBox) {
                    textBox.style.setProperty("background-color", cardBg, "important");
                    textBox.style.setProperty("color", bodyTextHex, "important");
                    textBox.querySelectorAll("p, li, ul, ol, span, strong").forEach(el => {
                        if (!el.closest(".tip-box")) {
                            el.style.setProperty("background-color", "transparent", "important");
                            el.style.setProperty("color", bodyTextHex, "important");
                        }
                    });
                }

                const mediaBox = island.querySelector(".island-media");
                if (mediaBox) {
                    mediaBox.style.setProperty("background-color", cardBg, "important");
                }

                const tipBox = island.querySelector(".tip-box");
                if (tipBox) {
                    tipBox.style.setProperty("background-color", tipBg, "important");
                    tipBox.style.setProperty("border-left-color", tipBorder, "important");
                    tipBox.style.setProperty("color", tipText, "important");
                    tipBox.querySelectorAll("strong, span").forEach(el => {
                        el.style.setProperty("background-color", "transparent", "important");
                        el.style.setProperty("color", tipText, "important");
                    });
                }

                island.querySelectorAll("a").forEach(a => {
                    a.style.setProperty("color", linkHex, "important");
                });
            }

            // Update summary background when a card is toggled open/closed
            islands.forEach(island => {
                island.addEventListener("toggle", () => styleCardElements(island));
            });

            // Cache Title and Text HTML so media/iframes/videos never reset on search or language switch
            function updatePristineCaches() {
                const strings = uiStrings[currentLang];
                db.forEach((item, index) => {
                    const island = islands[index];
                    const titleStr = currentLang === "id" && item.t_id ? item.t_id : item.t;
                    const tipStr = currentLang === "id" && item.p_id ? item.p_id : item.p;
                    const bodyStr = currentLang === "id" && item.c_id ? item.c_id : (item.c || "");
                    const tipHtml = tipStr ? `<div class="tip-box"><strong>${strings.proTip}</strong> ${tipStr}</div>` : "";

                    island.dataset.pristineTitle = titleStr;
                    island.dataset.pristineText = tipHtml + bodyStr;

                    quickChips[index].textContent = `${index + 1}. ${stripHtml(titleStr)}`;
                });
            }

            // 3. Quick Jump Index Click & Auto-Collapse Logic
            toggleQuickIndex.addEventListener("click", () => {
                const isCollapsed = quickIndexList.classList.toggle("collapsed");
                quickIndexArrow.textContent = isCollapsed ? "[+]" : "[-]";
            });

            quickIndexList.addEventListener("click", (e) => {
                const chip = e.target.closest(".quick-chip");
                if (!chip) return;
                const idx = chip.dataset.index;
                const targetIsland = document.getElementById(`island-${idx}`);
                if (!targetIsland) return;

                // Auto-collapse Quick Jump list after clicking so user gets maximum screen height
                quickIndexList.classList.add("collapsed");
                quickIndexArrow.textContent = "[+]";

                targetIsland.classList.remove("hidden");
                targetIsland.open = true;
                styleCardElements(targetIsland);

                const stickyHeight = isPinned ? stickyControls.offsetHeight : 0;
                const targetTop = targetIsland.getBoundingClientRect().top + window.pageYOffset - stickyHeight - 10;
                window.scrollTo({ top: targetTop, behavior: "smooth" });

                targetIsland.classList.add("flash-target");
                setTimeout(() => targetIsland.classList.remove("flash-target"), 1200);
            });

            // 4. Expand / Collapse / Pin Listeners
            expandAllBtn.addEventListener("click", () => islands.forEach(i => { i.open = true; styleCardElements(i); }));
            collapseAllBtn.addEventListener("click", () => islands.forEach(i => { i.open = false; styleCardElements(i); }));

            pinToggleBtn.addEventListener("click", () => {
                isPinned = !isPinned;
                stickyControls.classList.toggle("unpinned", !isPinned);
                updateUIText();
            });

            // 5. Search & Highlight Logic
            function applySearchFilter() {
                const query = searchInput.value.trim().toLowerCase();

                islands.forEach((island, index) => {
                    const titleNode = island.querySelector(".island-title");
                    const textNode = island.querySelector(".island-text");
                    const chip = quickChips[index];
                    
                    titleNode.innerHTML = island.dataset.pristineTitle;
                    textNode.innerHTML = island.dataset.pristineText;

                    if (!query) {
                        island.classList.remove("hidden");
                        chip.classList.remove("hidden");
                        styleCardElements(island);
                        return;
                    }

                    const titleText = titleNode.textContent.toLowerCase();
                    const bodyText = textNode.textContent.toLowerCase();

                    if (titleText.includes(query) || bodyText.includes(query)) {
                        island.classList.remove("hidden");
                        chip.classList.remove("hidden");
                        island.open = true; 
                        
                        if (titleText.includes(query)) highlightTextInNode(titleNode, query);
                        if (bodyText.includes(query)) highlightTextInNode(textNode, query);
                    } else {
                        island.classList.add("hidden");
                        chip.classList.add("hidden");
                    }
                    styleCardElements(island);
                });
            }

            searchInput.addEventListener("input", applySearchFilter);

            // 6. Language & Theme UI Sync
            function updateUIText() {
                const s = uiStrings[currentLang];
                document.documentElement.lang = currentLang;
                searchInput.placeholder = s.searchPlaceholder;
                quickIndexLabel.textContent = s.quickIndexLabel;
                expandAllBtn.textContent = s.expandAll;
                collapseAllBtn.textContent = s.collapseAll;
                pinToggleBtn.textContent = isPinned ? s.pinOn : s.pinOff;
                langToggleBtn.innerHTML = `${flagSVGs[currentLang]} <span>${s.langCode}</span>`;
                themeToggleBtn.textContent = currentTheme === "dark" ? s.themeLight : s.themeDark;
            }

            // Force background & text color on page, controls, AND every card title/data element
            function applyThemeClasses() {
                const isDark = currentTheme === "dark";
                const addCls = isDark ? "theme-dark" : "theme-light";
                const remCls = isDark ? "theme-light" : "theme-dark";

                const pageBg = isDark ? "#11151c" : "#8eaec9";
                const controlBg = isDark ? "#263040" : "#9fc0db";
                const boxBg = isDark ? "#1b222d" : "#b0cce4";
                const headerBg = isDark ? "#222b38" : "#8ab0d0";
                const borderHex = isDark ? "#2d3748" : "#6b92b5";
                const textHex = isDark ? "#e2e8f0" : "#0b1d30";

                [document.documentElement, document.body, appWrapper, stickyControls].forEach(el => {
                    if (!el) return;
                    el.classList.remove(remCls);
                    el.classList.add(addCls);
                    el.style.setProperty("background-color", pageBg, "important");
                    el.style.setProperty("color", textHex, "important");
                });

                // Walk up any Blogger parent containers
                let parent = appWrapper.parentElement;
                while (parent && parent !== document.body && parent !== document.documentElement) {
                    parent.style.setProperty("background-color", pageBg, "important");
                    parent.style.setProperty("color", textHex, "important");
                    parent = parent.parentElement;
                }

                // Style search box & quick index
                searchInput.style.setProperty("background-color", boxBg, "important");
                searchInput.style.setProperty("color", textHex, "important");
                searchInput.style.setProperty("border-color", borderHex, "important");
              	searchInput.style.setProperty("opacity", "1", "important");

                quickIndexContainer.style.setProperty("background-color", boxBg, "important");
                quickIndexContainer.style.setProperty("border-color", borderHex, "important");
                toggleQuickIndex.style.setProperty("background-color", headerBg, "important");
                toggleQuickIndex.style.setProperty("color", textHex, "important");
                quickIndexList.style.setProperty("background-color", boxBg, "important");

                // Style buttons & quick chips
                document.querySelectorAll(".ctrl-btn, .quick-chip").forEach(btn => {
                    btn.style.setProperty("background-color", controlBg, "important");
                    btn.style.setProperty("color", textHex, "important");
                    btn.style.setProperty("border-color", borderHex, "important");
                });

                // Style all cards (titles + data)
                islands.forEach(island => styleCardElements(island));
            }

            langToggleBtn.addEventListener("click", () => {
                currentLang = currentLang === "en" ? "id" : "en";
                updateUIText();
                updatePristineCaches();
                applySearchFilter();
            });

            // 7. Dark / Light Theme Toggle
            themeToggleBtn.addEventListener("click", () => {
                currentTheme = currentTheme === "light" ? "dark" : "light";
                applyThemeClasses();
                updateUIText();
            });

            // 8. Font Size Scaling Controls with Percentage Display
            function applyFontScale() {
                document.documentElement.style.fontSize = `${fontScale}%`;
                fontResetBtn.textContent = `${fontScale}%`;
            }

            fontIncBtn.addEventListener("click", () => {
                if (fontScale < 145) {
                    fontScale += 10;
                    applyFontScale();
                }
            });

            fontDecBtn.addEventListener("click", () => {
                if (fontScale > 85) {
                    fontScale -= 10;
                    applyFontScale();
                }
            });

            fontResetBtn.addEventListener("click", () => {
                fontScale = 100;
                applyFontScale();
            });

            // Initialize UI
            updatePristineCaches();
            applySearchFilter();
            applyThemeClasses();
            updateUIText();

            // Safe Highlighter (ignores scripts/styles/media links)
            function highlightTextInNode(node, query) {
                const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null, false);
                const nodesToReplace = [];

                let currentNode;
                while (currentNode = walker.nextNode()) {
                    if (currentNode.nodeValue.toLowerCase().includes(query) && 
                        currentNode.parentNode.nodeName !== 'SCRIPT' && 
                        currentNode.parentNode.nodeName !== 'STYLE') {
                        nodesToReplace.push(currentNode);
                    }
                }

                nodesToReplace.forEach(textNode => {
                    const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
                    const fragment = document.createDocumentFragment();
                    let lastIdx = 0;
                    
                    textNode.nodeValue.replace(regex, (match, p1, offset) => {
                        const before = textNode.nodeValue.slice(lastIdx, offset);
                        if (before) fragment.appendChild(document.createTextNode(before));
                        const mark = document.createElement('mark');
                        mark.textContent = match;
                        fragment.appendChild(mark);
                        lastIdx = offset + match.length;
                    });
                    
                    const after = textNode.nodeValue.slice(lastIdx);
                    if (after) fragment.appendChild(document.createTextNode(after));
                    textNode.parentNode.replaceChild(fragment, textNode);
                });
            }

            function escapeRegExp(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }
        });
    </script>
</body>
</html>
