<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; blob:;">
  <title>Data Viewer</title>
  <style>
    :root {
      --bg-base: #0f172a;
      --bg-panel: #1e293b;
      --bg-elevated: #334155;
      --bg-row-even: #162032;
      --bg-row-hover: #26354d;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --warn-bg: #451a03;
      --warn-border: #d97706;
      --warn-text: #fde68a;
      --danger-bg: #450a0a;
      --danger-border: #dc2626;
      --danger-text: #fecaca;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.5;
    }

    .app-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    input[type="text"],
    input[type="number"],
    select {
      background: var(--bg-base);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--accent);
    }

    input[type="file"] {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 100%;
    }

    button {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover:not(:disabled) {
      background: #475569;
      border-color: #64748b;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.active-preset {
      background: var(--accent-hover);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.btn-primary {
      background: var(--accent-hover);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.btn-danger {
      background: #991b1b;
      border-color: #ef4444;
      color: #ffffff;
    }

    .notice-banner {
      display: none;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid transparent;
    }

    .notice-banner.warn {
      display: block;
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }

    .notice-banner.danger {
      display: block;
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .banner-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .banner-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .status-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .metric-val {
      color: var(--text-main);
      font-weight: 600;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 68vh;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: auto;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #1e293b;
      color: var(--text-main);
      border-bottom: 2px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
      z-index: 2;
    }

    thead th:hover {
      background: var(--bg-elevated);
    }

    thead th.row-num-header {
      width: 56px;
      text-align: right;
      color: var(--text-muted);
      cursor: default;
    }

    tbody td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 8px 12px;
      max-width: 380px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tbody td.row-num-cell {
      text-align: right;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      background: #172133;
    }

    tbody tr:nth-child(even) {
      background: var(--bg-row-even);
    }

    tbody tr:hover {
      background: var(--bg-row-hover);
    }

    mark {
      background: #eab308;
      color: #0f172a;
      padding: 0 2px;
      border-radius: 2px;
      font-weight: 600;
    }

    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .pagination-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .page-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-title">Data Viewer</div>
    <div class="control-row">
      <button id="loadSampleBtn" type="button">Sample Data</button>
      <button id="exportBtn" type="button" class="btn-primary" disabled>Export CSV</button>
    </div>
  </header>

  <section class="toolbar">
    <div class="control-group">
      <span class="control-label">File</span>
      <div class="control-row">
        <input type="file" id="fileInput" accept=".csv,.tsv,.txt,.log,.dat">
      </div>
    </div>

    <div class="control-group">
      <span class="control-label">Delimiter</span>
      <div class="control-row">
        <button type="button" id="autoDetectBtn" class="active-preset">Auto</button>
        <button type="button" class="delim-preset" data-delim=",">Comma</button>
        <button type="button" class="delim-preset" data-delim="&#9;">Tab</button>
        <button type="button" class="delim-preset" data-delim=";">Semicolon</button>
        <button type="button" class="delim-preset" data-delim="|">Pipe</button>
        <input type="text" id="customDelimInput" placeholder="Custom" maxlength="10" style="width: 72px;" title="Custom delimiter">
      </div>
    </div>

    <div class="control-group">
      <span class="control-label">Search &amp; View</span>
      <div class="control-row">
        <input type="text" id="searchInput" placeholder="Search all columns..." style="flex: 1; min-width: 160px;">
        <button type="button" id="clearSearchBtn">Clear</button>
        <select id="pageSizeSelect" title="Rows per page">
          <option value="10">10 / page</option>
          <option value="25" selected>25 / page</option>
          <option value="50">50 / page</option>
          <option value="100">100 / page</option>
          <option value="250">250 / page</option>
        </select>
      </div>
    </div>
  </section>

  <div id="noticeBanner" class="notice-banner" role="alert">
    <div id="bannerTitle" class="banner-title"></div>
    <div id="bannerDesc"></div>
    <div id="bannerActions" class="banner-actions"></div>
  </div>

  <div class="status-bar">
    <div class="status-metrics">
      <span>File: <span id="metaFileName" class="metric-val">None</span></span>
      <span>Size: <span id="metaFileSize" class="metric-val">0 B</span></span>
      <span>Delimiter: <span id="metaDelimiter" class="metric-val">Auto</span></span>
      <span>Rows: <span id="metaTotalRows" class="metric-val">0</span></span>
      <span>Matching: <span id="metaFilteredRows" class="metric-val">0</span></span>
      <span>Sort: <span id="metaSortState" class="metric-val">Default</span></span>
    </div>
  </div>

  <div class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody">
        <tr>
          <td class="empty-state">Choose a file above to view its contents.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-bar">
    <div class="page-buttons">
      <button type="button" id="firstPageBtn" disabled>&laquo; First</button>
      <button type="button" id="prevPageBtn" disabled>&lsaquo; Prev</button>
      <span id="pageButtonsContainer" class="page-buttons"></span>
      <button type="button" id="nextPageBtn" disabled>Next &rsaquo;</button>
      <button type="button" id="lastPageBtn" disabled>Last &raquo;</button>
    </div>
    <div class="control-row">
      <span id="pageSummaryText" style="color: var(--text-muted); font-size: 13px;">Page 0 of 0</span>
      <input type="number" id="jumpPageInput" min="1" placeholder="Page" style="width: 72px;" disabled>
      <button type="button" id="jumpPageBtn" disabled>Go</button>
    </div>
  </div>

  <script>
    "use strict";

    // Safety limits
    const WARN_FILE_BYTES  = 10 * 1024 * 1024; // 10 MB
    const STOP_FILE_BYTES  = 50 * 1024 * 1024; // 50 MB
    const SAFE_SLICE_BYTES = 5 * 1024 * 1024;  // 5 MB preview slice
    const MAX_ROW_COUNT    = 200000;
    const MAX_COL_COUNT    = 500;
    const MAX_CELL_CHARS   = 32768;
    const MAX_SEARCH_CHARS = 256;

    // State variables
    let activeDelimiter = ",";
    let isAutoDelimiter = true;
    let rawFileText     = "";
    let headers         = [];
    let allRows         = [];
    let viewRows        = [];
    let currentPage     = 1;
    let sortColIndex    = -1;
    let sortDirection   = "none";

    // DOM elements
    const fileInput            = document.getElementById("fileInput");
    const autoDetectBtn        = document.getElementById("autoDetectBtn");
    const customDelimInput     = document.getElementById("customDelimInput");
    const presetButtons        = document.querySelectorAll(".delim-preset");
    const searchInput          = document.getElementById("searchInput");
    const clearSearchBtn       = document.getElementById("clearSearchBtn");
    const pageSizeSelect       = document.getElementById("pageSizeSelect");
    const loadSampleBtn        = document.getElementById("loadSampleBtn");
    const exportBtn            = document.getElementById("exportBtn");

    const noticeBanner         = document.getElementById("noticeBanner");
    const bannerTitle          = document.getElementById("bannerTitle");
    const bannerDesc           = document.getElementById("bannerDesc");
    const bannerActions        = document.getElementById("bannerActions");

    const metaFileName         = document.getElementById("metaFileName");
    const metaFileSize         = document.getElementById("metaFileSize");
    const metaDelimiter        = document.getElementById("metaDelimiter");
    const metaTotalRows        = document.getElementById("metaTotalRows");
    const metaFilteredRows     = document.getElementById("metaFilteredRows");
    const metaSortState        = document.getElementById("metaSortState");

    const tableHead            = document.getElementById("tableHead");
    const tableBody            = document.getElementById("tableBody");
    const firstPageBtn         = document.getElementById("firstPageBtn");
    const prevPageBtn          = document.getElementById("prevPageBtn");
    const nextPageBtn          = document.getElementById("nextPageBtn");
    const lastPageBtn          = document.getElementById("lastPageBtn");
    const pageButtonsContainer = document.getElementById("pageButtonsContainer");
    const pageSummaryText      = document.getElementById("pageSummaryText");
    const jumpPageInput        = document.getElementById("jumpPageInput");
    const jumpPageBtn          = document.getElementById("jumpPageBtn");

    function describeDelimiter(delim, isAuto) {
      const names = {
        ",": "Comma (,)",
        "\t": "Tab",
        ";": "Semicolon (;)",
        "|": "Pipe (|)",
        ":": "Colon (:)"
      };
      const label = names[delim] || `"${delim}"`;
      return isAuto ? `Auto (${label})` : label;
    }

    function updateDelimiterUI() {
      autoDetectBtn.classList.toggle("active-preset", isAutoDelimiter);
      presetButtons.forEach(btn => {
        const match = !isAutoDelimiter && btn.getAttribute("data-delim") === activeDelimiter;
        btn.classList.toggle("active-preset", match);
      });
      metaDelimiter.textContent = describeDelimiter(activeDelimiter, isAutoDelimiter);
    }

    function setManualDelimiter(rawInput) {
      isAutoDelimiter = false;
      if (typeof rawInput !== "string" || rawInput.length === 0) {
        activeDelimiter = ",";
      } else {
        const unescaped = rawInput === "\\t" ? "\t" : rawInput;
        activeDelimiter = unescaped.slice(0, 10);
      }
      updateDelimiterUI();
    }

    // Quote-aware delimiter auto-detection
    function detectDelimiterFromSample(text) {
      if (!text) return ",";
      const sample = text.slice(0, 16384);
      const lines = [];
      let currentLine = "";
      let inQuotes = false;

      for (let i = 0; i < sample.length && lines.length < 20; i++) {
        const ch = sample[i];
        if (ch === '"') {
          inQuotes = !inQuotes;
          currentLine += ch;
        } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
          if (currentLine.trim().length > 0) {
            lines.push(currentLine);
          }
          currentLine = "";
          if (ch === "\r" && i + 1 < sample.length && sample[i + 1] === "\n") {
            i++;
          }
        } else {
          currentLine += ch;
        }
      }
      if (currentLine.trim().length > 0 && lines.length < 20) {
        lines.push(currentLine);
      }

      if (lines.length === 0) return ",";

      const candidates = [",", "\t", ";", "|", ":"];
      let bestDelim = ",";
      let bestScore = -1;

      candidates.forEach(cand => {
        const counts = lines.map(line => {
          let count = 0;
          let quoted = false;
          for (let i = 0; i < line.length; i++) {
            if (line[i] === '"') quoted = !quoted;
            else if (!quoted && line[i] === cand) count++;
          }
          return count;
        });

        const firstCount = counts[0];
        if (firstCount > 0) {
          const consistent = counts.every(c => c === firstCount);
          const avg = counts.reduce((a, b) => a + b, 0) / counts.length;
          const score = consistent ? firstCount * 15 : avg;
          if (score > bestScore) {
            bestScore = score;
            bestDelim = cand;
          }
        }
      });

      return bestDelim;
    }

    autoDetectBtn.addEventListener("click", () => {
      isAutoDelimiter = true;
      customDelimInput.value = "";
      if (rawFileText) {
        activeDelimiter = detectDelimiterFromSample(rawFileText);
        updateDelimiterUI();
        currentPage = 1;
        parseAndProcessText();
      } else {
        updateDelimiterUI();
      }
    });

    presetButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        customDelimInput.value = "";
        setManualDelimiter(btn.getAttribute("data-delim"));
        if (rawFileText) {
          currentPage = 1;
          parseAndProcessText();
        }
      });
    });

    customDelimInput.addEventListener("input", () => {
      if (customDelimInput.value.length === 0) return;
      setManualDelimiter(customDelimInput.value);
      if (rawFileText) {
        currentPage = 1;
        parseAndProcessText();
      }
    });

    customDelimInput.addEventListener("blur", () => {
      if (customDelimInput.value.length === 0 && !isAutoDelimiter) {
        updateDelimiterUI();
      }
    });

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    function hideBanner() {
      noticeBanner.className = "notice-banner";
      bannerTitle.textContent = "";
      bannerDesc.textContent = "";
      bannerActions.textContent = "";
    }

    function showBanner(level, titleText, descText, actionButtons) {
      noticeBanner.className = `notice-banner ${level}`;
      bannerTitle.textContent = titleText;
      bannerDesc.textContent = descText;
      bannerActions.textContent = "";
      actionButtons.forEach(cfg => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = cfg.label;
        if (cfg.className) btn.className = cfg.className;
        btn.addEventListener("click", cfg.onClick);
        bannerActions.appendChild(btn);
      });
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      hideBanner();

      const size = file.size;

      // Over 50 MB: Stop full load, offer preview or cancel
      if (size > STOP_FILE_BYTES) {
        showBanner(
          "danger",
          `File Too Large (${formatBytes(size)})`,
          `This file exceeds the 50 MB limit for full in-browser loading. You can stop the process or preview the first 5 MB safely.`,
          [
            {
              label: "Cancel",
              className: "btn-danger",
              onClick: () => {
                fileInput.value = "";
                hideBanner();
              }
            },
            {
              label: "Preview First 5 MB",
              className: "btn-primary",
              onClick: () => loadSafeFileSlice(file, SAFE_SLICE_BYTES)
            }
          ]
        );
        return;
      }

      // 10 MB to 50 MB: Warn and ask user before loading
      if (size > WARN_FILE_BYTES) {
        showBanner(
          "warn",
          `Large File Selected (${formatBytes(size)})`,
          `Opening this entire file may slow down your browser. Would you like to preview the first 5 MB or load the complete file?`,
          [
            {
              label: "Cancel",
              onClick: () => {
                fileInput.value = "";
                hideBanner();
              }
            },
            {
              label: "Preview First 5 MB",
              className: "btn-primary",
              onClick: () => loadSafeFileSlice(file, SAFE_SLICE_BYTES)
            },
            {
              label: "Load Complete File",
              onClick: () => loadFullFile(file)
            }
          ]
        );
        return;
      }

      loadFullFile(file);
    });

    async function loadFullFile(file) {
      try {
        hideBanner();
        metaFileName.textContent = file.name;
        metaFileSize.textContent = formatBytes(file.size);
        rawFileText = await file.text();
        if (isAutoDelimiter) {
          activeDelimiter = detectDelimiterFromSample(rawFileText);
        }
        updateDelimiterUI();
        currentPage = 1;
        sortColIndex = -1;
        sortDirection = "none";
        parseAndProcessText();
      } catch (err) {
        showBanner("danger", "Unable to Read File", String(err.message || err), []);
      }
    }

    async function loadSafeFileSlice(file, sliceBytes) {
      try {
        const blobSlice = file.slice(0, sliceBytes);
        let sliceText = await blobSlice.text();

        const lastNewline = sliceText.lastIndexOf("\n");
        if (lastNewline > 0) {
          sliceText = sliceText.slice(0, lastNewline);
        }

        metaFileName.textContent = `${file.name} (Preview)`;
        metaFileSize.textContent = `${formatBytes(sliceText.length)} of ${formatBytes(file.size)}`;
        rawFileText = sliceText;
        if (isAutoDelimiter) {
          activeDelimiter = detectDelimiterFromSample(rawFileText);
        }
        updateDelimiterUI();
        currentPage = 1;
        sortColIndex = -1;
        sortDirection = "none";
        parseAndProcessText();

        showBanner(
          "warn",
          "Preview Mode Active",
          `Showing the first ${formatBytes(sliceBytes)} of ${file.name}.`,
          [{ label: "Dismiss", onClick: hideBanner }]
        );
      } catch (err) {
        showBanner("danger", "Unable to Read File", String(err.message || err), []);
      }
    }

    function parseDelimitedSafe(text, delimiter) {
      const safeDelim = (typeof delimiter === "string" && delimiter.length > 0) ? delimiter : ",";
      const delimLen = safeDelim.length;

      const rows = [];
      let currentRow = [];
      let currentCell = "";
      let inQuotes = false;
      let i = 0;
      const len = text.length;

      let truncatedByRowCap = false;
      let truncatedByColCap = false;
      let truncatedByCellCap = false;

      while (i < len) {
        const ch = text[i];

        if (inQuotes) {
          if (ch === '"') {
            if (i + 1 < len && text[i + 1] === '"') {
              if (currentCell.length < MAX_CELL_CHARS) {
                currentCell += '"';
              } else {
                truncatedByCellCap = true;
              }
              i += 2;
              continue;
            } else {
              inQuotes = false;
              i++;
              continue;
            }
          } else {
            if (currentCell.length < MAX_CELL_CHARS) {
              currentCell += ch;
            } else {
              truncatedByCellCap = true;
            }
            i++;
            continue;
          }
        }

        if (ch === '"' && currentCell.length === 0) {
          inQuotes = true;
          i++;
          continue;
        }

        if (text.startsWith(safeDelim, i)) {
          if (currentRow.length < MAX_COL_COUNT) {
            currentRow.push(currentCell);
          } else {
            truncatedByColCap = true;
          }
          currentCell = "";
          i += delimLen;
          continue;
        }

        if (ch === "\r" || ch === "\n") {
          if (ch === "\r" && i + 1 < len && text[i + 1] === "\n") {
            i++;
          }
          if (currentRow.length < MAX_COL_COUNT) {
            currentRow.push(currentCell);
          }
          if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== "")) {
            rows.push(currentRow);
          }
          if (rows.length >= MAX_ROW_COUNT + 1) {
            truncatedByRowCap = true;
            break;
          }
          currentRow = [];
          currentCell = "";
          i++;
          continue;
        }

        if (currentCell.length < MAX_CELL_CHARS) {
          currentCell += ch;
        } else {
          truncatedByCellCap = true;
        }
        i++;
      }

      if (!truncatedByRowCap && (currentCell.length > 0 || currentRow.length > 0)) {
        if (currentRow.length < MAX_COL_COUNT) {
          currentRow.push(currentCell);
        }
        rows.push(currentRow);
      }

      return { rows, truncatedByRowCap, truncatedByColCap, truncatedByCellCap };
    }

    function parseAndProcessText() {
      const result = parseDelimitedSafe(rawFileText, activeDelimiter);
      const parsed = result.rows;

      if (parsed.length === 0) {
        headers = [];
        allRows = [];
        viewRows = [];
        exportBtn.disabled = true;
        renderAll();
        return;
      }

      headers = parsed[0].map((h, idx) => {
        const clean = h.trim();
        return clean.length > 0 ? clean : `Column ${idx + 1}`;
      });

      const bodySlice = parsed.slice(1);
      allRows = bodySlice.map((cells, idx) => ({
        __index: idx + 1,
        cells: cells
      }));

      exportBtn.disabled = allRows.length === 0;

      if (result.truncatedByRowCap || result.truncatedByColCap || result.truncatedByCellCap) {
        const notices = [];
        if (result.truncatedByRowCap) notices.push(`Displayed rows capped at ${MAX_ROW_COUNT.toLocaleString()}`);
        if (result.truncatedByColCap) notices.push(`Displayed columns capped at ${MAX_COL_COUNT}`);
        if (result.truncatedByCellCap) notices.push(`Long cells trimmed at ${MAX_CELL_CHARS.toLocaleString()} characters`);
        showBanner(
          "warn",
          "Display Limit Reached",
          notices.join(" • "),
          [{ label: "Dismiss", onClick: hideBanner }]
        );
      }

      applyFilterAndSort();
    }

    function applyFilterAndSort() {
      const rawQuery = searchInput.value.slice(0, MAX_SEARCH_CHARS).trim().toLowerCase();

      if (rawQuery.length === 0) {
        viewRows = allRows.slice();
      } else {
        viewRows = allRows.filter(rowObj => {
          for (let c = 0; c < headers.length; c++) {
            const val = rowObj.cells[c];
            if (val && val.toLowerCase().indexOf(rawQuery) !== -1) {
              return true;
            }
          }
          return false;
        });
      }

      if (sortColIndex >= 0 && sortDirection !== "none") {
        const dirMultiplier = sortDirection === "asc" ? 1 : -1;
        const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });

        viewRows.sort((a, b) => {
          const rawA = (a.cells[sortColIndex] ?? "").trim();
          const rawB = (b.cells[sortColIndex] ?? "").trim();

          if (rawA === "" && rawB === "") return a.__index - b.__index;
          if (rawA === "") return 1;
          if (rawB === "") return -1;

          const numA = Number(rawA.replace(/[$,%\s]/g, ""));
          const numB = Number(rawB.replace(/[$,%\s]/g, ""));
          if (!Number.isNaN(numA) && !Number.isNaN(numB) && rawA !== "" && rawB !== "") {
            if (numA !== numB) return (numA - numB) * dirMultiplier;
          }

          return collator.compare(rawA, rawB) * dirMultiplier;
        });

        const colName = headers[sortColIndex] || `Column ${sortColIndex + 1}`;
        metaSortState.textContent = `${colName} (${sortDirection === "asc" ? "A–Z" : "Z–A"})`;
      } else {
        metaSortState.textContent = "Default";
      }

      metaTotalRows.textContent = allRows.length.toLocaleString();
      metaFilteredRows.textContent = viewRows.length.toLocaleString();

      renderAll();
    }

    searchInput.addEventListener("input", () => {
      currentPage = 1;
      applyFilterAndSort();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      currentPage = 1;
      applyFilterAndSort();
    });

    pageSizeSelect.addEventListener("change", () => {
      currentPage = 1;
      renderAll();
    });

    function renderSafeHighlightedCell(td, cellText, queryLower) {
      const text = String(cellText ?? "");
      if (!queryLower || queryLower.length === 0) {
        td.textContent = text;
        return;
      }

      const lowerText = text.toLowerCase();
      const qLen = queryLower.length;
      let cursor = 0;
      let matchIdx = lowerText.indexOf(queryLower, cursor);

      if (matchIdx === -1) {
        td.textContent = text;
        return;
      }

      while (matchIdx !== -1) {
        if (matchIdx > cursor) {
          td.appendChild(document.createTextNode(text.slice(cursor, matchIdx)));
        }
        const markNode = document.createElement("mark");
        markNode.textContent = text.slice(matchIdx, matchIdx + qLen);
        td.appendChild(markNode);

        cursor = matchIdx + qLen;
        matchIdx = lowerText.indexOf(queryLower, cursor);
      }

      if (cursor < text.length) {
        td.appendChild(document.createTextNode(text.slice(cursor)));
      }
    }

    function renderAll() {
      tableHead.textContent = "";
      tableBody.textContent = "";

      if (headers.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.className = "empty-state";
        td.textContent = "Choose a file above to view its contents.";
        tr.appendChild(td);
        tableBody.appendChild(tr);
        updatePaginationControls(0, 1);
        return;
      }

      const headTr = document.createElement("tr");
      const numTh = document.createElement("th");
      numTh.className = "row-num-header";
      numTh.textContent = "#";
      headTr.appendChild(numTh);

      headers.forEach((hText, colIdx) => {
        const th = document.createElement("th");
        let indicator = " \u2195";
        if (sortColIndex === colIdx) {
          indicator = sortDirection === "asc" ? " \u2191" : " \u2193";
        }
        th.textContent = hText + indicator;
        th.addEventListener("click", () => {
          if (sortColIndex !== colIdx) {
            sortColIndex = colIdx;
            sortDirection = "asc";
          } else if (sortDirection === "asc") {
            sortDirection = "desc";
          } else {
            sortColIndex = -1;
            sortDirection = "none";
          }
          applyFilterAndSort();
        });
        headTr.appendChild(th);
      });
      tableHead.appendChild(headTr);

      const pageSize = parseInt(pageSizeSelect.value, 10) || 25;
      const totalPages = Math.max(1, Math.ceil(viewRows.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      if (viewRows.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = headers.length + 1;
        td.className = "empty-state";
        td.textContent = "No matching records found.";
        tr.appendChild(td);
        tableBody.appendChild(tr);
        updatePaginationControls(0, 1);
        return;
      }

      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, viewRows.length);
      const pageSlice = viewRows.slice(startIdx, endIdx);
      const queryLower = searchInput.value.slice(0, MAX_SEARCH_CHARS).trim().toLowerCase();

      const fragment = document.createDocumentFragment();
      pageSlice.forEach(rowObj => {
        const tr = document.createElement("tr");

        const numTd = document.createElement("td");
        numTd.className = "row-num-cell";
        numTd.textContent = String(rowObj.__index);
        tr.appendChild(numTd);

        for (let c = 0; c < headers.length; c++) {
          const td = document.createElement("td");
          const cellVal = rowObj.cells[c] ?? "";
          td.title = cellVal.slice(0, 500);
          renderSafeHighlightedCell(td, cellVal, queryLower);
          tr.appendChild(td);
        }
        fragment.appendChild(tr);
      });

      tableBody.appendChild(fragment);
      updatePaginationControls(viewRows.length, totalPages);
    }

    function updatePaginationControls(totalItems, totalPages) {
      pageButtonsContainer.textContent = "";

      if (totalItems === 0) {
        pageSummaryText.textContent = "Page 0 of 0";
        firstPageBtn.disabled = true;
        prevPageBtn.disabled = true;
        nextPageBtn.disabled = true;
        lastPageBtn.disabled = true;
        jumpPageInput.disabled = true;
        jumpPageBtn.disabled = true;
        return;
      }

      pageSummaryText.textContent = `Page ${currentPage} of ${totalPages}`;
      firstPageBtn.disabled = currentPage <= 1;
      prevPageBtn.disabled = currentPage <= 1;
      nextPageBtn.disabled = currentPage >= totalPages;
      lastPageBtn.disabled = currentPage >= totalPages;
      jumpPageInput.disabled = totalPages <= 1;
      jumpPageBtn.disabled = totalPages <= 1;
      jumpPageInput.max = String(totalPages);

      const windowRadius = 2;
      const startPage = Math.max(1, currentPage - windowRadius);
      const endPage = Math.min(totalPages, currentPage + windowRadius);

      for (let p = startPage; p <= endPage; p++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = String(p);
        if (p === currentPage) btn.className = "active-preset";
        btn.addEventListener("click", () => {
          currentPage = p;
          renderAll();
        });
        pageButtonsContainer.appendChild(btn);
      }
    }

    firstPageBtn.addEventListener("click", () => { currentPage = 1; renderAll(); });
    prevPageBtn.addEventListener("click", () => { if (currentPage > 1) { currentPage--; renderAll(); } });
    nextPageBtn.addEventListener("click", () => { currentPage++; renderAll(); });
    lastPageBtn.addEventListener("click", () => {
      const pageSize = parseInt(pageSizeSelect.value, 10) || 25;
      currentPage = Math.max(1, Math.ceil(viewRows.length / pageSize));
      renderAll();
    });

    jumpPageBtn.addEventListener("click", () => {
      const target = parseInt(jumpPageInput.value, 10);
      if (!Number.isNaN(target) && target >= 1) {
        currentPage = target;
        renderAll();
      }
    });

    function formatCellForExport(value, delimiter) {
      let str = String(value ?? "");
      if (/^[=+\-@\t\r]/.test(str)) {
        str = "'" + str;
      }
      if (str.includes('"') || str.includes("\n") || str.includes("\r") || str.includes(delimiter)) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    exportBtn.addEventListener("click", () => {
      if (headers.length === 0) return;
      const lines = [];

      lines.push(headers.map(h => formatCellForExport(h, activeDelimiter)).join(activeDelimiter));
      viewRows.forEach(rowObj => {
        const rowStr = headers.map((_, c) => formatCellForExport(rowObj.cells[c] ?? "", activeDelimiter)).join(activeDelimiter);
        lines.push(rowStr);
      });

      const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `data_export_${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    loadSampleBtn.addEventListener("click", () => {
      hideBanner();
      fileInput.value = "";
      isAutoDelimiter = true;
      customDelimInput.value = "";
      const sampleLines = [
        'Order_ID,Client,Location,Category,Amount,Status',
        'ORD-1041,"Meridian Health, Ltd.","Nanjing, CN",Medical Supplies,"$1,420.00",Completed',
        'ORD-1042,"Nusantara Logistics","Jakarta, ID",Freight & Customs,"$980.50",In Transit',
        'ORD-1043,"Apex Semiconductor","Singapore, SG",Hardware,"$3,640.00",Completed',
        'ORD-1044,"Pacific Clinical Lab","Surabaya, ID",Diagnostics,"$2,150.75",Processing',
        'ORD-1045,"Kansai Biotech","Osaka, JP",Reagents,"$1,890.00",Completed',
        'ORD-1046,"EuroMed Distribution","Frankfurt, DE",Equipment,"$5,120.00",Pending'
      ];
      rawFileText = sampleLines.join("\n");
      activeDelimiter = detectDelimiterFromSample(rawFileText);
      updateDelimiterUI();
      metaFileName.textContent = "sample_orders.csv";
      metaFileSize.textContent = formatBytes(rawFileText.length);
      currentPage = 1;
      sortColIndex = -1;
      sortDirection = "none";
      parseAndProcessText();
    });

    loadSampleBtn.click();
  </script>
</body>
